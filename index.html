<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de Ayuda Interna - Top Neumáticos</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #ef4444;
    --success: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 90px;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .status.show { display: block; }
  .status.ok {
    background: rgba(34,197,94,0.1);
    border: 1px solid var(--success);
    color: var(--success);
  }
  .status.err {
    background: rgba(239,68,68,0.1);
    border: 1px solid var(--danger);
    color: var(--danger);
  }
  .required { color: var(--danger); }
</style>
</head>
<body>

<div class="card">
  <h1>🎫 Mesa de Ayuda Interna</h1>
  <p class="subtitle">Reportá un problema con el sistema y se cargará como ticket.</p>

  <form id="ticketForm">

    <label>Título del problema <span class="required">*</span></label>
    <input type="text" id="titulo" required placeholder="Ej: No puedo facturar en sucursal Centro">

    <label>Descripción <span class="required">*</span></label>
    <textarea id="descripcion" required placeholder="Detalle qué pasó, cuándo, y qué mensaje de error viste (si hay)"></textarea>

    <label>Tu nombre <span class="required">*</span></label>
    <input type="text" id="nombre" required placeholder="Nombre y apellido">

    <label>Sucursal / Área</label>
    <input type="text" id="sucursal" placeholder="Ej: Depósito, Sucursal Centro, Administración">

    <label>Prioridad</label>
    <select id="prioridad">
      <option value="0">Baja</option>
      <option value="1" selected>Normal</option>
      <option value="2">Alta</option>
      <option value="3">Urgente</option>
    </select>

    <button type="submit" id="submitBtn">Enviar ticket</button>

    <div class="status" id="status"></div>
  </form>
</div>

<script>
  // ==== CONFIGURACIÓN ====
  const WEBHOOK_URL = "https://envy-recollect-last.ngrok-free.dev/webhook-test/mesa-interna"; // reemplazar con la URL real del webhook
  // ========================

  const form = document.getElementById('ticketForm');
  const statusDiv = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  function showStatus(message, isError) {
    statusDiv.textContent = message;
    statusDiv.className = 'status show ' + (isError ? 'err' : 'ok');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      titulo: document.getElementById('titulo').value.trim(),
      descripcion: document.getElementById('descripcion').value.trim(),
      nombre: document.getElementById('nombre').value.trim(),
      sucursal: document.getElementById('sucursal').value.trim(),
      prioridad: document.getElementById('prioridad').value
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';
    statusDiv.className = 'status';

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error('Respuesta del servidor: ' + response.status);
      }

      showStatus('✅ Ticket enviado correctamente. Gracias.', false);
      form.reset();

    } catch (err) {
      showStatus('❌ Error al enviar el ticket: ' + err.message, true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar ticket';
    }
  });
</script>

</body>
</html>
